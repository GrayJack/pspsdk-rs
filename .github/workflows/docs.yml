name: docs
on:
  push:
   branches:
   - dev
   paths-ignore:
      - "**.md"
      - LICENSE
      - .github/FUNDING.yml
      - .gitignore

jobs:
  rustdoc:
    runs-on: ubuntu-latest
    env:
      # RUSTFLAGS: -D warnings
      CARGO_INCREMENTAL: 0
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        components: rust-src

    - name: Cache cargo output
      uses: Swatinem/rust-cache@v2

    - name: Build Rust Documentation
      run: cargo doc -p pspsdk --target=mipsel-sony-psp --features=kernel -Zbuild-std=core,alloc,compiler_builtins,panic_unwind,panic_abort

    - name: Deploy Docs
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./target/mipsel-sony-psp/doc
        force_orphan: true
