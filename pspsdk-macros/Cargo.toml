[package]
name = "pspsdk-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = [
    "clone-impls",
    "full",
    "parsing",
    "printing",
    "proc-macro",
], default-features = false }
quote = { version = "1", default-features = false }
proc-macro2 = "1"
sha1 = "0.11.0"

